name: Build OneForAll macOS Binary

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # 支持手动点击编译

jobs:
  build-macos-binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 安装编译工具
      - name: Install dependencies
        run: |
          brew install make gcc
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller  # 打包二进制工具

      # 编译 macOS 版 massdns
      - name: Compile massdns
        run: |
          cd thirdparty/massdns
          make
          cd ../../

      # 打包成独立二进制文件
      - name: Build OneForAll Binary
        run: |
          pyinstaller --onefile --clean \
            --add-binary "thirdparty/massdns/bin/massdns:thirdparty/massdns/bin/" \
            --name oneforall \
            oneforall.py

      # 上传最终二进制文件
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: OneForAll-macOS-Binary
          path: dist/oneforall
