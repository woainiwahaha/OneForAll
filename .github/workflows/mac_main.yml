name: Build OneForAll macOS Binary

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-macos-binary:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # 👇 修复：自动下载编译好的 macOS massdns，不再执行make
      - name: Download pre-built massdns for macOS
        run: |
          mkdir -p thirdparty/massdns/bin
          cd thirdparty/massdns/bin
          curl -L -o massdns https://github.com/blechschmidt/massdns/releases/download/v1.0.0/massdns-darwin
          chmod +x massdns
          cd ../../../

      - name: Build Binary
        run: |
          pyinstaller --onefile --clean \
            --add-binary "thirdparty/massdns/bin/massdns:thirdparty/massdns/bin/" \
            --name oneforall \
            oneforall.py

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: OneForAll-macOS-Binary
          path: dist/oneforall
